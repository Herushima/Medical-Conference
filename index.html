 ${rows.length?`<p class="sub">Kategori: ${esc(Object.entries(byC).map(([a,b])=>a+' '+b).join(' · '))}<br>Status: ${esc(Object.entries(byS).map(([a,b])=>a+' '+b).join(' · '))}</p>
 <div class="tw"><table class="rep"><thead><tr><th>No</th><th>Nama</th><th>No RM</th><th>Kesimpulan post tindakan</th><th>Hasil echo</th><th>Keputusan conference</th></tr></thead><tbody>${g.map(x=>`<tr class="grp"><td colspan="6">Konferensi ${esc(fmtLong(x.date))}</td></tr>`+x.rows.map(p=>`<tr><td>${++n}</td><td>${esc(p.nama)}</td><td>${esc(p.rm)}</td><td>${esc(p.dxPasca)}</td><td>${esc(echoCell(p))}</td><td>${esc(decCell(p))}</td></tr>`).join('')).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada pasien dengan tanggal konferensi pada rentang ini.</div>'}
 <p class="sub" id="repMsg" role="status"></p></div>
 <div class="sf"><button class="btn" id="repWord"${off}>Unduh Word</button><button class="btn p" id="repPdf"${off}>Unduh PDF</button></div>`;
 const upd=()=>{rep.from=$('#rFrom').value||rep.from;rep.to=$('#rTo').value||rep.to;if(rep.from>rep.to){const t=rep.from;rep.from=rep.to;rep.to=t}rep.which=$('#rWhich').value;drawReport()};
 $('#rFrom').onchange=upd;$('#rTo').onchange=upd;$('#rWhich').onchange=upd;
 $('#sh').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{[rep.from,rep.to]=Q[+b.dataset.q][1]();drawReport()});
 $('#repPdf').onclick=()=>exportPdf(rows,K);$('#repWord').onclick=()=>exportWord(rows,K)}
const rmsg=t=>{const m=$('#repMsg');if(m)m.textContent=t};
async function saveFile(name,data){const blob=data instanceof Blob?data:new Blob([data]);
 if(dl){try{await dl.save({filename:name,data:blob})}catch(e){if(e&&e.code=='declined')return;rmsg('File tidak bisa disimpan ('+((e&&e.code)||'coba lagi')+').')}return}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function exportPdf(rows,K){
 const b=$('#repPdf');b.disabled=true;b.textContent='Menyusun PDF…';
 try{await loadScript(LIB.jspdf);await loadScript(LIB.autotable);
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const cl=s=>String(s||'').replace(/✓/g,'(v)').replace(/[–—]/g,'-').replace(/→/g,'->').replace(/[^\x09\x0A\x0D\x20-\x7E\u00A0-\u00FF]/g,'');
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(REP_TITLE,W/2,16,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(cl(periodTxt()),W/2,22,{align:'center'});
  doc.setFontSize(8.5);doc.setTextColor(80);doc.text(cl(kpiTxt(rows,K)),W/2,27,{align:'center'});doc.setTextColor(0);
  let y=35,n=0;
  for(const x of groups(rows)){
   if(y>H-35){doc.addPage();y=16}
   doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(cl('Tanggal pelaksanaan conference : '+fmtLong(x.date)),12,y);
   doc.autoTable({startY:y+3,margin:{left:12,right:12,bottom:14},theme:'grid',head:[['No','Nama','No RM','Kesimpulan Post Tindakan','Hasil Echo','Keputusan conference']],
    body:x.rows.map(p=>[String(++n),cl(p.nama),cl(p.rm),cl(p.dxPasca),cl(echoCell(p)),cl(decCell(p))]),
    styles:{font:'helvetica',fontSize:8.5,cellPadding:2,valign:'top',lineColor:[190,200,200],lineWidth:.2,textColor:[20,33,41]},
    headStyles:{fillColor:[11,59,71],textColor:[255,255,255],fontStyle:'bold',halign:'center'},
    columnStyles:{0:{cellWidth:11,halign:'center'},1:{cellWidth:38},2:{cellWidth:24},3:{cellWidth:50},4:{cellWidth:72},5:{cellWidth:'auto'}}});
   y=doc.lastAutoTable.finalY+10}
  const pg=doc.internal.getNumberOfPages();
  for(let i=1;i<=pg;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);doc.text(cl('Heart Team Tracker - dicetak '+fmtLong(TODAY)+' - RAHASIA'),12,H-7);doc.text(i+'/'+pg,W-12,H-7,{align:'right'})}
  await saveFile(`Laporan-Konferensi-IDIK_${rep.from}_sd_${rep.to}.pdf`,doc.output('blob'));
 }catch(e){rmsg('PDF gagal disusun. Periksa koneksi lalu coba lagi.')}
 if(b.isConnected){b.disabled=false;b.textContent='Unduh PDF'}}
async function exportWord(rows,K){
 const b=$('#repWord');b.disabled=true;b.textContent='Menyusun Word…';
 try{await loadScript(LIB.docx);const D=window.docx;
  const F='Times New Roman',TW=15398,cw=[5,15,10,18,26,26].map(x=>Math.round(TW*x/100));
  const run=(t,o)=>new D.TextRun(Object.assign({text:t,font:F,size:20},o||{}));
  const lines=t=>String(t||'').split('\n').map((l,i)=>run(l,i?{break:1}:{}));
  const cell=(t,i,o)=>{o=o||{};return new D.TableCell({width:{size:cw[i],type:D.WidthType.DXA},shading:o.h?{type:D.ShadingType.CLEAR,color:'auto',fill:'D9E4E6'}:undefined,margins:{top:60,bottom:60,left:90,right:90},children:[new D.Paragraph({alignment:o.c?D.AlignmentType.CENTER:D.AlignmentType.LEFT,children:o.h?[run(t,{bold:true})]:lines(t)})]})};
  const para=(t,r,p)=>new D.Paragraph(Object.assign({alignment:D.AlignmentType.CENTER,children:[run(t,r)]},p||{}));
  let n=0;const kids=[para(REP_TITLE,{bold:true,size:28}),para(periodTxt()),para(kpiTxt(rows,K),{size:18,color:'555555'},{spacing:{after:240}})];
  groups(rows).forEach(x=>{
   kids.push(new D.Paragraph({spacing:{before:240,after:80},children:[run('Tanggal pelaksanaan conference : '+fmtLong(x.date),{bold:true})]}));
   kids.push(new D.Table({width:{size:TW,type:D.WidthType.DXA},columnWidths:cw,rows:[new D.TableRow({tableHeader:true,children:['No','Nama','No RM','Kesimpulan Post Tindakan','Hasil Echo','Keputusan conference'].map((h,i)=>cell(h,i,{h:1}))})].concat(x.rows.map(p=>new D.TableRow({children:[cell((++n)+'.',0,{c:1}),cell(p.nama,1),cell(p.rm,2),cell(p.dxPasca,3),cell(echoCell(p),4),cell(decCell(p),5)]})))}))});
  kids.push(new D.Paragraph({spacing:{before:280},children:[run('Dicetak dari Heart Team Tracker '+fmtLong(TODAY)+' · RAHASIA',{size:16,color:'555555'})]}));
  const doc=new D.Document({sections:[{properties:{page:{size:{orientation:D.PageOrientation.LANDSCAPE,width:11906,height:16838},margin:{top:720,bottom:720,left:720,right:720}}},children:kids}]});
  await saveFile(`Laporan-Konferensi-IDIK_${rep.from}_sd_${rep.to}.docx`,await D.Packer.toBlob(doc));
 }catch(e){rmsg('Word gagal disusun. Periksa koneksi lalu coba lagi.')}
 if(b.isConnected){b.disabled=false;b.textContent='Unduh Word'}}
/* ---------- global ---------- */
document.addEventListener('click',e=>{
 if(e.target.closest('[data-rep]')){openReport();return}
 if(e.target.closest('[data-new]')){openForm();return}
 const qv=e.target.closest('[data-qv]');if(qv){e.stopPropagation();const p=P.find(x=>x.id==qv.dataset.qv);if(p){p.verif={by:role,at:TODAY};persist();render();toast('Keputusan terverifikasi')}return}
 const o=e.target.closest('[data-open]');if(o){openForm(P.find(x=>x.id==o.dataset.open));return}
 const f=e.target.closest('[data-f]');if(f){flt=f.dataset.f;render();return}
 const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;render();return}
 const t=e.target.closest('.nav [data-t]');if(t){tab=t.dataset.t;render();window.scrollTo(0,0);return}
 if(e.target.id=='reset'){P=seed();persist();render();toast('Data contoh dikembalikan')}});
$('#fab').onclick=()=>openForm();
document.addEventListener('change',e=>{if(e.target.id=='rl'){role=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;const s=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(s,s)}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#ov').hidden)closeForm()});
render();
</script></body></html>
